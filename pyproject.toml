[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-rss-summarizer"
version = "0.1.0"
description = "AI-powered RSS feed summarizer with trend prediction"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Bryan Paget", email = "bryanpaget@pm.me"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "feedparser>=6.0.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "httpx>=0.25.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
]

[project.optional-dependencies]
gemini = [
    "google-generativeai>=0.3.0",
]
claude-api = [
    "anthropic>=0.18.0",
]
openai-agents = [
    "openai-agents~=0.6.0",
    "nest-asyncio~=1.6.0",
]
all-providers = [
    "google-generativeai>=0.3.0",
    "anthropic>=0.18.0",
    "openai-agents~=0.6.0",
    "nest-asyncio~=1.6.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
rss = "src.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["src", "src.*"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "error",
    # FAISS SWIG internal types lack __module__ - upstream issue in SWIG, not fixable by us
    # These types (SwigPyPacked, SwigPyObject, swigvarlink) are internal plumbing we never use
    # Approved for suppression: 2026-01-15
    "ignore:builtin type Swig:DeprecationWarning",
]
